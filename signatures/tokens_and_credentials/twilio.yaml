---
filename: twilio.yaml
signatures:

  - name: Twilio API Tokens
    status: enabled
    author: Andrew Byford
    date: "2026-02-20"
    description: Detects exposed Twilio API tokens
    severity: "70"
    references:
      - https://www.twilio.com/docs/iam/api-keys/key-resource-v1
    notes:
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - api.twilio.com
          - TWILIO_API
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - api.twilio.com
          - TWILIO_API
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - api.twilio.com
          - twilio_*
    test_cases:
      match_cases:
        - SK0123456789abcdef0123456789ABCDEF
        - SKa1b2c3d4e5f6a7b8c9d0e1f2A3B4C5D6
      fail_cases:
        - SK_TEST_6f9cfc9d413272ec0a65f2fd1b14ab10
    patterns:
      - (^|[^A-Fa-f0-9])(SK[0-9a-fA-F]{32})($|[^A-Fa-f0-9])

