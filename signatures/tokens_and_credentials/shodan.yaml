---
filename: shodan.yaml
signatures:

  - name: Shodan API Tokens
    status: enabled
    author: Andrew Byford
    date: "2020-10-26"
    description: Detects exposed Shodan API tokens
    references:
      - https://developer.shodan.io/api
    severity: "70"
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - shodan.io
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - shodan.io
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - '*shodan.io'
          - shodan_*
    test_cases:
      match_cases:
        - "SHODAN_API_KEY=AbCdEfGhIjKlMnOpQrStUvWxYz012345"
        - "SHODAN_APIKEY: 0123456789ABCDEfghijkLMNOPqrstUV"
        - "https://api.shodan.io/account/profile?key=AbCdEfGhIjKlMnOpQrStUvWxYz012345"
        - "https://api.shodan.io/shodan/host/1.1.1.1?key=0123456789ABCDEfghijkLMNOPqrstUV"
      fail_cases:
        - AbCdEfGhIjKlMnOpQrStUvWxYz012345
    patterns:
      - (?i)(^|[^A-Za-z0-9_])(?:SHODAN_API(?:_|)?KEY|https?://api\.shodan\.io[^\s"'<>]{0,200}[?&]key)\s*(?:=|:)?\s*([A-Za-z0-9]{32})($|[^A-Za-z0-9_])

