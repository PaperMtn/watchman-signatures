---
filename: cloudflare.yaml
signatures:

  - name: Cloudflare API Tokens
    status: enabled
    author: Andrew Byford
    date: "2026-02-20"
    description: Detects exposed Cloudflare API tokens
    severity: "70"
    notes:
    references:
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - api.cloudflare.com
          - cloudflare_*
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - api.cloudflare.com
          - cloudflare_*
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - api.cloudflare.com
          - cloudflare_*
    test_cases:
      match_cases:
        - "Authorization: Bearer aB3dEfGhIjKlMnOpQrStUvWxYz0123456789_-Aa"
        - "CLOUDFLARE_API_TOKEN=9a8b7c6d5e4F3g2H1i0JkLmNoPqRsTuVwXyZ_-12"
        - "CLOUDFLARE_API_TOKEN: 9a8b7c6d5e4F3g2H1i0JkLmNoPqRsTuVwXyZ_-12"
      fail_cases:
        - 9a8b7c6d5e4F3g2H1i0JkLmNoPqRsTuVwXyZ_-12
    patterns:
      - (?i)(^|[^A-Za-z0-9_])(?:Authorization\s*:\s*Bearer|CLOUDFLARE_API_TOKEN)\s*(?:=|:)?\s*([A-Za-z0-9_-]{40})(?=$|[^A-Za-z0-9_])

