---
filename: stripe.yaml
signatures:

  - name: Stripe API Tokens
    status: enabled
    author: PaperMtn
    date: "2026-02-20"
    description: Detects exposed Stripe API tokens
    references:
      - https://docs.stripe.com/api/authentication
    severity: "70"
    notes:
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - sk_live
          - sk_test
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - sk_live
          - sk_test
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - sk_test -(svg|png|jpeg)
          - sk_live -(svg|png|jpeg)
    test_cases:
      match_cases:
        - sk_live_aaaaaarmZltoKlnSZMaaaaaa
        - sk_test_aaaaaarmZltoKlnSZMaaaaaa
      fail_cases:
        - uk_live_aaaaaarmZltoKlnSZMaaaaaa
    patterns:
      - (^|[^A-Za-z0-9_])(sk_(?:test|live)_[A-Za-z0-9]{16,64})($|[^A-Za-z0-9_])

