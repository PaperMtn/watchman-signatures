---
filename: google.yaml
signatures:

  - name: Google API Tokens
    status: enabled
    author: PaperMtn
    date: "2026-03-27"
    description: Detects exposed API keys for Google services including Gemini, Google Maps, and YouTube
    severity: "70"
    references:
      - https://docs.cloud.google.com/docs/authentication/api-keys
      - https://ai.google.dev/gemini-api/docs/api-key
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        search_strings:
          - AIza
          - .apps.googleusercontent.com
          - GEMINI_API_KEY
          - ai.google.dev
          - api.generativelanguage.googleapis.com
          - generativelanguage.googleapis.com
          - Google AI Studio
      slack_eg:
        scope:
          - messages
          - drafts
        locations:
          - public
          - private
          - connect
        search_strings:
          - AIza
          - .apps.googleusercontent.com
          - GEMINI_API_KEY
          - ai.google.dev
          - api.generativelanguage.googleapis.com
          - generativelanguage.googleapis.com
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - 'AIza -(html|svg|png|jpeg)'
          - 'GEMINI_API_KEY'
          - 'ai.google.dev'
          - 'api.generativelanguage.googleapis.com'
    test_cases:
      match_cases:
        - '"current_key": "AIzaABABABABABABABABABABABABABABABABABA"'
        - 'GEMINI_API_KEY=AIzaSyDaGmWKa4JsXZ-HjGw7ISLn_3namBGewQe'
      fail_cases:
        - '"current_key": $GOOGLE_AIZA_KEY'
        - 'GEMINI_API_KEY=$GEMINI_API_KEY'
    patterns:
      - (^|[^A-Za-z0-9_-])AIza[A-Za-z0-9_-]{35}($|[^A-Za-z0-9_-])

  - name: GCP Service Account Files
    status: enabled
    author: PaperMtn
    date: "2021-09-24"
    description: Detects exposed GPC service account files
    severity: "90"
    notes:
    references:
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - files
        file_types:
        search_strings:
          - iam.gserviceaccount.com
      slack_eg:
        scope:
          - files
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - iam.gserviceaccount.com
    gitlab:
      scope:
        - blobs
      search_strings:
        - 'private_key extension:json'
    test_cases:
      match_cases:
        - '"private_key": "-----BEGIN PRIVATE KEY-----AABBCCDDEEFFGGHHIIJJKK=\n-----END
          PRIVATE KEY-----\n'
      fail_cases:
        - '"private_key": $PRIVATE_KEY_FILE'
    patterns:
      - '(?s)(-----BEGIN .+?-----)\\S{0,}'

  - name: GCP Service Accounts in Text
    status: enabled
    author: PaperMtn
    date: "2021-09-24"
    description: Detects exposed GPC service account credentials in text
    severity: "90"
    notes:
    references:
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - "-----BEGIN PRIVATE KEY-----"
          - iam.gserviceaccount.com
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - "-----BEGIN PRIVATE KEY-----"
          - iam.gserviceaccount.com
    test_cases:
      match_cases:
        - '"private_key": "-----BEGIN PRIVATE KEY-----AABBCCDDEEFFGGHHIIJJKK=\n-----END
          PRIVATE KEY-----\n'
      fail_cases:
        - '"private_key": $PRIVATE_KEY_FILE'
    patterns:
      - '(?s)(-----BEGIN .+?-----)\\S{0,}'