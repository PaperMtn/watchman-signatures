---
filename: aws.yaml
signatures:

  - name: AWS Access Key ID and Secret Access Key
    status: enabled
    author: Andrew Byford
    date: "2026-02-20"
    description: Detects exposed AWS access key IDs paired with a secret access key.
    severity: "90"
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        search_strings:
          - aws_access_key_id
          - aws_secret_access_key
          - AKIA
          - ASIA
      slack_eg:
        scope:
          - messages
          - drafts
        locations:
          - public
          - private
          - connect
        search_strings:
          - aws_access_key_id
          - aws_secret_access_key
          - AKIA
          - ASIA
      gitlab:
        scope:
          - blobs
          - commits
          - issues
          - merge_requests
          - notes
        search_strings:
          - 'AWS_ACCESS_KEY_ID'
          - 'AWS_SECRET_ACCESS_KEY'
          - 'AKIA'
          - 'ASIA'
    test_cases:
      match_cases:
        - |
          AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        - |
          aws_access_key_id = ASIAIOSFODNN7EXAMPLE
          aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      fail_cases:
        - AbCdEfGh1234567890AbAbAb+aAb1111111111+=AAA
        - AKIAIOSFODNN7EXAMPLE not_a_secret=1234567890123456789012345678901234567890
    patterns:
      - (?is)(^|[^A-Za-z0-9_])(?:AWS_ACCESS_KEY_ID|aws_access_key_id)\s*[:=]\s*((?:AKIA|ASIA)[0-9A-Z]{16})\b[\s\S]{0,300}\b(?:AWS_SECRET_ACCESS_KEY|aws_secret_access_key)\s*[:=]\s*([A-Za-z0-9\/+=]{40})($|[^A-Za-z0-9_])

  - name: AWS Session Token
    status: enabled
    author: Andrew Byford
    date: "2026-02-20"
    description: Detects exposed AWS session tokens (typically alongside temporary ASIA credentials).
    severity: "80"
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        search_strings:
          - aws_session_token
          - ASIA
      slack_eg:
        scope:
          - messages
          - drafts
        locations:
          - public
          - private
          - connect
        search_strings:
          - aws_session_token
          - ASIA
      gitlab:
        scope:
          - blobs
          - commits
          - issues
          - merge_requests
          - notes
        search_strings:
          - 'AWS_SESSION_TOKEN'
          - 'aws_session_token'
          - 'ASIA'
    test_cases:
      match_cases:
        - "AWS_SESSION_TOKEN=IQoJb3JpZ2luX2VjEOr//////////wEaCXVzLWVhc3QtMSJHMEUCIQDhExampleTokenValue0123456789+/=ABCDEFGHIJKL"
        - "aws_session_token : IQoJb3JpZ2luX2VjEOr//////////wEaCXVzLWVhc3QtMSJHMEUCIQDExampleTokenValue_0123456789-__-__"
      fail_cases:
        - "AWS_SESSION_TOKEN=short"
        - "session_token=1234567890"
    patterns:
      - (?i)(^|[^A-Za-z0-9_])(?:AWS_SESSION_TOKEN|aws_session_token)\s*[:=]\s*([\"']?)([A-Za-z0-9+\/=_-]{80,4096})\1($|[^A-Za-z0-9_])

  - name: AWS CLI credentials/config file presence
    status: enabled
    author: Andrew Byford
    date: "2026-02-20"
    description: Detects presence of common AWS CLI credential/config artifacts in files.
    severity: "75"
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - files
        search_strings:
          - ".aws/credentials"
          - ".aws/config"
          - "aws_access_key_id"
          - "aws_secret_access_key"
      slack_eg:
        scope:
          - files
          - drafts
        locations:
          - public
          - private
          - connect
        search_strings:
          - ".aws/credentials"
          - ".aws/config"
          - "aws_access_key_id"
          - "aws_secret_access_key"
      gitlab:
        scope:
          - blobs
        search_strings:
          - ".aws/credentials"
          - ".aws/config"
          - "aws_access_key_id"
          - "aws_secret_access_key"
    test_cases:
      match_cases:
        - blank
      fail_cases:
        - blank
    patterns:
      - ""
