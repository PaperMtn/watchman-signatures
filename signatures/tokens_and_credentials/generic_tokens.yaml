---
filename: generic_tokens.yaml
signatures:

  - name: Access Tokens
    status: enabled
    author: PaperMtn
    date: "2026-02-20"
    description: Detects exposed access_tokens
    severity: "70"
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - "access_token"
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - "access_token"
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - '"access_token:"'
    test_cases:
      match_cases:
        - '"access_token": "ya29.a0AfH6SMCw9xJkLmNoPqRsTuVwXyZ0123456789_-AaBbCcDdEeFf"'
        - "access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkFuZHJldyJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
        - "access_token=AbCdEfGhIjKlMnOpQrStUvWxYz0123456789-_._~+/=="
        - "ACCESS_TOKEN: 123456789abcdefg123456789123456789"
      fail_cases:
        - "ACCESS_TOKEN: $ACCESS_TOKEN"
    patterns:
      - (?i)(^|[^A-Za-z0-9_])access_token(["'‘’`]?)\s*(?:[:="']\s*|\s+)(["'‘’`]?)([A-Za-z0-9._~+\/=-]{30,512})\2($|[^A-Za-z0-9_])

  - name: Bearer Tokens
    status: enabled
    author: PaperMtn
    date: "2026-02-20"
    description: Detects exposed bearer tokens_and_credentials
    severity: "70"
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - bearer
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - Bearer
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - Bearer
          - "'Authorization': 'Bearer"
    test_cases:
      match_cases:
        - "Authorization: 'Bearer ABABAB1111111ABABAB++__..--..abcdefg'"
      fail_cases:
        - "'Authorization': 'Bearer {}'.format(get_token())"
    patterns:
      - (?i)(^|[^A-Za-z0-9_])Bearer(?:\s+|:\s*)(["'‘’`]?)([A-Za-z0-9._~+\-\/=]{30,1024})\2($|[^A-Za-z0-9_])

  - name: JSON Web Tokens
    status: enabled
    author: PaperMtn
    date: "2026-02-10"
    description: Detects exposed JWT tokens
    severity: "70"
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - eyJ
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - eyJ
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - eyJ
    test_cases:
      match_cases:
        - "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkFuZHJldyBCeWZvcmQiLCJpYXQiOjE1MTYyMzkwMjJ9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
      fail_cases:
        - "'Authorization': 'Bearer {}'.format(get_token())"
    patterns:
      - (?<![A-Za-z0-9_-])(eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})(?![A-Za-z0-9_-])


  - name: Client Secrets
    status: enabled
    author: PaperMtn
    date: "2021-09-24"
    description: Detects exposed client_secrets
    severity: "70"
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - "client_secret"
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - "client_secret"
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - '"client_secret:"'
    test_cases:
      match_cases:
        - "client_secret: '123456789abcdefg123456789123456789'"
        - '"client_secret": "aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789_-AaBbCcDdEeFf"'
        - "clientSecret=0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_-._~+/=="
        - 'client_secret: "mN0bV2cX4zA6sD8fG1hJ3kL5pQ7rT9uW2yE4iO6aBcDeFgH"'
      fail_cases:
        - "client_secret: $CLIENT_SECRET"
    patterns:
      - (?i)(^|[^A-Za-z0-9_])(client_secret|clientSecret)(["'‘’`]?)\s*[:=]\s*(["'‘’`]?)([A-Za-z0-9._~+\-\/=]{30,512})\3($|[^A-Za-z0-9_])

  - name: Private Tokens
    status: enabled
    author: PaperMtn
    date: "2021-09-24"
    description: Detects exposed private_tokens
    severity: "70"
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - PRIVATE
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - PRIVATE
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - PRIVATE
    test_cases:
      match_cases:
        - 'private_token: "aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789_-AaBbCc"'
        - 'private-token=0123456789abcdefghijklmnopqrstuvwxyzABCDEfghijkLMNOP'
        - 'privateToken:`mN0bV2cX4zA6sD8fG1hJ3kL5pQ7rT9uW2yE4iO6`'
        - '‘private_token’: ZXhhbXBsZS50b2tlbi5zdHJpbmcxMjM0NTY3ODkw'
      fail_cases:
        - "PRIVATE-TOKEN: $PRIVATE_TOKEN"
    patterns:
      - (?i)(^|[^A-Za-z0-9_])["'‘’`]?((?:private[-_]token)|privateToken)["'‘’`]?\s*[:=]\s*(["'‘’`]?)([A-Za-z0-9._~+\-\/=]{20,256})\3($|[^A-Za-z0-9_])

  - name: X-API Keys
    status: enabled
    author: PaperMtn
    date: "2021-10-12"
    description: Detects exposed X-API keys
    severity: "70"
    notes:
    references:
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - x-api-key
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - x-api-key
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - x-api-key
    test_cases:
      match_cases:
        - "x-api-key: aanncccccqaaassscxcc"
        - "x-api-key = aanncccccqaaassscxcc"
        - "x-api-key: aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789_-Aa"
        - "X-API-KEY=0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_-"
        - '"x-api-key": "ZXhhbXBsZS1hcGkta2V5XzEyMzQ1Njc4OTBfYWJjZGVmZw=="'
        - 'curl -H "x-api-key: AbCdEfGhIjKlMnOpQrStUvWxYz0123456789" https://example.com'
      fail_cases:
        - "key = 1234567893feefc5f0q5000bfo0c38d90bbeb"
    patterns:
      - (?i)(^|[^A-Za-z0-9_-])["']?x-api-key["']?\s*(?::|=|\s)\s*(["']?)([A-Za-z0-9._~+\-\/=]{20,256})\2($|[^A-Za-z0-9_-])

  - name: X-Auth keys
    status: enabled
    author: PaperMtn
    date: "2021-10-12"
    description: Detects exposed X-Auth tokens
    severity: "70"
    notes:
    references:
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - x-auth-key
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - x-auth-key
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - x-auth-key
    test_cases:
      match_cases:
        - "X-Auth-Key: aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789_-AaBbCcDd"
        - "x-auth-key=0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_-"
        - '"X-Auth-Key": "ZXhhbXBsZS1nbG9iYWwta2V5XzEyMzQ1Njc4OTBfYWJjZA=="'
        - 'curl -H "X-Auth-Key: AbCdEfGhIjKlMnOpQrStUvWxYz0123456789" -H "X-Auth-Email: me@example.com" https://api.cloudflare.com/client/v4/user'
      fail_cases:
        - "key = 1234567893feefc5f0q5000bfo0c38d90bbeb"
    patterns:
      - (?i)(^|[^A-Za-z0-9_-])["']?X-Auth-Key["']?\s*(?::|=|\s)\s*(["']?)([A-Za-z0-9._~+\-\/=]{24,128})\2($|[^A-Za-z0-9_-])
