---
filename: new_relic.yaml
signatures:

  - name: New Relic API Tokens (Prefixed)
    status: enabled
    author: Andrew Byford
    date: "2026-02-20"
    description: Detects exposed New Relic API Tokens (Prefixed)
    severity: "90"
    references:
      - https://registry.terraform.io/providers/newrelic/newrelic/3.76.3/docs/guides/migration_guide_v2
    notes:
    watchman_apps:
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - nrak
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - 'nrak -(svg|png|jpeg)'
    test_cases:
      match_cases:
        - NRAK-aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789_-AaBb
        - NRAK-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_-
      fail_cases:
        - "NRRA-0TBbaAQApxx6ykLgRElSk8UuMVWn02qUZgSu4C58Jc"
    patterns:
      - (?i)(^|[^A-Za-z0-9_-])(NRAK-[A-Za-z0-9_-]{20,120})($|[^A-Za-z0-9_-])