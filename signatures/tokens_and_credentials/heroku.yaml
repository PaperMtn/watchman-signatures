---
filename: heroku.yaml
signatures:

  - name: Heroku API Tokens
    status: enabled
    author: PaperMtn
    date: "2026-02-20"
    description: Detects exposed Heroku API tokens
    severity: "70"
    references:
      - https://devcenter.heroku.com/changelog-items/2842
      - https://devcenter.heroku.com/articles/oauth
    notes:
    watchman_apps:
      slack_std:
        category: secrets
        scope:
          - messages
        file_types:
        search_strings:
          - HRKU
      slack_eg:
        scope:
          - messages
          - drafts
        file_types:
        locations:
          - public
          - private
          - connect
        search_strings:
          - HRKU
      gitlab:
        scope:
          - blobs
          - commits
          - milestones
          - wiki_blobs
          - issues
          - merge_requests
          - notes
          - snippet_titles
        search_strings:
          - HRKU
    test_cases:
      match_cases:
        - HRKU-AALJCYR7SRzPkj9_BGqhi1jAI1J5P4WfD6ITENvdVydAPCnNcAlrMMahHrTo
        - HRKU-57dce771-afad-4c41-a8a5-d10b7fbc743c
        - HRKU-AALJCYR7SRzPkj9_BGqhi1jAI1J5P4WfD6ITENvdVydAPCnNcAlrMMahHrTo
      fail_cases:
        - HRKU-57dce771-afad-4c4-a8a-d10b7fbc743c
        - HRKU-abcDEF1234567890_abcDEF1234567890_abcDEF1234567890
        - HRKU-1a2B3c4D5e6F7g8H9i0JkLmNoPqRsTuVwXyZ_-aBcDeFgHiJk
    patterns:
      - (^|[^A-Za-z0-9_])(HRKU-(?:[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}|[A-Za-z0-9_-]{60,120}))($|[^A-Za-z0-9_])
